<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color & Gradient Design Studio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-obsidian: #0A0A0A;
      --bg-panel: #121214;
      --bg-card: #18181B;
      --border-subtle: #27272A;
      --border-hover: #3F3F46;
      --text-main: #F4F4F5;
      --text-muted: #A1A1AA;
      --accent-taupe: #8C735B;
    }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      line-height: 1.5;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-hover);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background: #27272A;
    }

    .btn-primary {
      background: #F4F4F5;
      color: #09090B;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #FFFFFF;
    }

    /* Layout Grid */
    .top-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 960px) {
      .top-grid {
        grid-template-columns: 7fr 5fr;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Inputs & Controls */
    .add-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
    }

    .hex-input {
      width: 84px;
      background: var(--bg-card);
      border: 1px solid var(--border-hover);
      color: #FFFFFF;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-transform: uppercase;
      outline: none;
    }

    .hex-input:focus {
      border-color: var(--accent-taupe);
    }

    input[type="range"] {
      accent-color: var(--accent-taupe);
      cursor: pointer;
      height: 4px;
      background: #27272A;
      border-radius: 4px;
    }

    select.select-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-hover);
      color: #FFFFFF;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    /* Gradient Slots */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .slot-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .slot-swatch {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .slot-hex {
      font-size: 12px;
      font-family: ui-monospace, monospace;
      color: #E4E4E7;
      width: 62px;
    }

    .slot-slider {
      flex: 1;
      min-width: 50px;
    }

    .slot-alpha {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-muted);
      width: 34px;
      text-align: right;
    }

    .slot-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 5px;
      font-size: 13px;
      border-radius: 4px;
    }

    .icon-btn:hover {
      color: #FFFFFF;
      background: #27272A;
    }

    .icon-btn.danger:hover {
      color: #F87171;
    }

    /* Sub-rows */
    .two-col-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    @media (min-width: 600px) {
      .two-col-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    .control-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Ticker-box Pattern Grid */
    .pattern-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    @media (min-width: 600px) {
      .pattern-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .ticker-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: #D4D4D8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .ticker-btn:hover {
      border-color: var(--border-hover);
    }

    .ticker-btn.active {
      background: #F4F4F5;
      color: #09090B;
      border-color: #FFFFFF;
    }

    .ticker-check {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      border: 1px solid #52525B;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: transparent;
    }

    .ticker-btn.active .ticker-check {
      background: #09090B;
      border-color: #09090B;
      color: #FFFFFF;
    }

    /* Ribbon Presets */
    .ribbon-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .ribbon-btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .ribbon-btn:hover {
      color: #FFFFFF;
    }

    .ribbon-btn.active {
      background: #27272A;
      color: #FFFFFF;
      border-color: #71717A;
    }

    .mini-sliders {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .mini-sliders input[type="range"] {
      flex: 1;
    }

    /* Live Gradient Canvas */
    .preview-canvas {
      position: relative;
      width: 100%;
      min-height: 360px;
      height: 100%;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: linear-gradient(45deg, #18181b 25%, transparent 25%),
                        linear-gradient(-45deg, #18181b 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #18181b 75%),
                        linear-gradient(-45deg, transparent 75%, #18181b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .ribbon-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: background 0.3s ease;
    }

    .surface-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 300px;
      border-radius: 16px;
      padding: 20px;
      transition: all 0.25s ease;
    }

    .surface-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      color: rgba(244, 244, 245, 0.75);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34D399;
    }

    .surface-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .surface-card p {
      font-size: 12px;
      color: rgba(244, 244, 245, 0.8);
